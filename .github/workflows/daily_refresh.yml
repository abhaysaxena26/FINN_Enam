name: Daily Market & Filing Refresh

on:
  schedule:
    # 18:00 UTC = 23:30 IST (Mon-Fri after NSE/BSE market close)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh Prices, Filings & Alerts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Refresh End-of-Day Prices & Multiples
        run: |
          python pipeline/refresh_prices.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Fetch BSE Corporate Announcements
        run: |
          python pipeline/fetch_announcements.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Classify Filings & Generate Push Digest
        run: |
          python pipeline/classify_and_enrich.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FLASH_MODEL: ${{ secrets.GEMINI_FLASH_MODEL || 'gemini-2.5-flash' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Evaluate Threshold Alerts & Coincidences
        run: |
          python pipeline/run_alerts.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Commit updated fallback snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore(data): automated daily market snapshot update [skip ci]"
            git push
          fi
